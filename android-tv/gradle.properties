android.useAndroidX=true
kotlin.code.style=official
org.gradle.jvmargs=-Xmx2048m

# 构建环境说明:
#   AGP 8.2.2 起支持 JDK 21 (8.2.0/8.2.1 有 core-for-system-modules.jar 的
#   jlink "Invalid module name: 'for'" bug, 会让 compileReleaseJavaWithJavac 失败)。
#   本地默认 JDK 21 可直接构建; CI 用 actions/setup-java '17' 亦可。
#
# 单元测试 (src/test) 依赖 compileReleaseJavaWithJavac, 因此也需要 AGP >= 8.2.2。
